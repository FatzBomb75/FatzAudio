name: build

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the NuGet as the stable version from the header (run on main)'
        type: boolean
        default: false

# A newer push to the same pull request cancels the older run. Runs on main (which
# publish the NuGet) and manual runs are never cancelled.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every compile goes through ccache (each job restores and saves its own cache).
env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CMAKE_OBJC_COMPILER_LAUNCHER: ccache

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on 22.04 so the packaged libfatzaudio.so needs only glibc 2.35.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          key: build-${{ matrix.os }}
          max-size: 500M
      - name: Count the CPUs
        shell: bash
        run: echo "JOBS=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)" >> "$GITHUB_ENV"
      - name: Install Linux audio headers and FFmpeg (runtime codecs and the helper test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libavformat-dev libavcodec-dev libmp3lame0
      # LAME is loaded at runtime like an app would ship it, so the MP3 tests run
      # (FA_TEST_REQUIRE_LAME makes a missing LAME fail them instead of skipping).
      - name: Install LAME (macOS)
        if: runner.os == 'macOS'
        run: brew install lame
      # Real audio output (FA_TEST_REAL_SYSTEM: the device test and the system AAC
      # decoder must run, not skip). The runner has no sound device, so BlackHole's
      # virtual one. (HTTPS through URLSession is checked in the iOS simulator job,
      # devices.yml: a hosted Mac refuses to trust a test root without a person.)
      - name: Virtual sound device (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          echo "FA_TEST_REAL_SYSTEM=1" >> "$GITHUB_ENV"
      # Only the built libmp3lame.dll is cached (a vcpkg install is over a minute);
      # bump the key to refresh it.
      - name: Restore LAME (Windows)
        id: lame
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lame
          key: lame-x64-windows-v1
      - name: Install LAME (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ "${{ steps.lame.outputs.cache-hit }}" != "true" ]; then
            "$VCPKG_INSTALLATION_ROOT/vcpkg" install mp3lame:x64-windows
            dll=$(find "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" -iname '*mp3lame*.dll' | head -1)
            test -n "$dll"
            mkdir -p "$RUNNER_TEMP/lame"
            cp "$dll" "$RUNNER_TEMP/lame/libmp3lame.dll"
          fi
          test -f "$RUNNER_TEMP/lame/libmp3lame.dll"
          cygpath -w "$RUNNER_TEMP/lame" >> "$GITHUB_PATH"
      # Ninja instead of the Visual Studio generator on Windows: the latter ignores
      # the compiler launcher, so ccache would never see a compile.
      - name: Set up the MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Configure
        shell: bash
        run: |
          gen=()
          if [ "$RUNNER_OS" = "Windows" ]; then gen=(-G Ninja); fi
          cmake -S . -B build "${gen[@]}" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel "$JOBS"
      - name: Library size
        continue-on-error: true   # a report: never keeps the tests from running
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) tools/lib-size.sh "Windows x64" build/bin/fatzaudio.dll ;;
            macOS) tools/lib-size.sh "macOS" build/bin/libfatzaudio.dylib ;;
            *) tools/lib-size.sh "Linux x64" build/bin/libfatzaudio.so ;;
          esac
      # libcurl (Linux) and WinHTTP (Windows) get the end-to-end HTTPS tests the iOS
      # simulator has: a local server with a test certificate the system trusts.
      - name: Start the HTTPS test server (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          py=python3; [ "$RUNNER_OS" = "Windows" ] && py=python
          $py tools/test-https/serve.py tests/data "$RUNNER_TEMP/https" > "$RUNNER_TEMP/https.log" 2>&1 &
          for i in $(seq 150); do
            $py -c "import socket; socket.create_connection(('127.0.0.1', 8443), 1)" 2>/dev/null && break
            sleep 0.2
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            certutil -addstore -f Root "$RUNNER_TEMP/https/ca.crt"
          else
            sudo cp "$RUNNER_TEMP/https/ca.crt" /usr/local/share/ca-certificates/fatzaudio-test.crt
            sudo update-ca-certificates
          fi
          echo "FA_NET_HTTPS_URL=https://127.0.0.1:8443/net/tone_cbr.mp3" >> "$GITHUB_ENV"
          echo "FA_NET_HTTPS_ECHO_URL=https://user:p%20w@127.0.0.1:8443/echo-headers" >> "$GITHUB_ENV"
      - name: Test
        shell: bash
        env:
          FA_TEST_REQUIRE_LAME: '1'
        run: ctest --test-dir build -C Release -j "$JOBS" --output-on-failure
      - name: HTTPS test server log
        if: failure() && runner.os != 'macOS'
        shell: bash
        run: cat "$RUNNER_TEMP/https.log"
      # The win-x64 and linux-x64 libraries go into the NuGet package (job "package");
      # the .NET tests below run against these staged copies.
      - name: Stage the native library for the NuGet package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p native
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/bin/fatzaudio.dll native/
          else
            cp -L build/bin/libfatzaudio.so native/
            strip --strip-unneeded native/libfatzaudio.so
          fi
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: native-${{ runner.os }}
          path: native/
          retention-days: 7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: .NET build (docs enforced) and test
        shell: bash
        env:
          FA_TEST_REQUIRE_LAME: '1'
        run: |
          native="$GITHUB_WORKSPACE/native"
          if [ "$RUNNER_OS" = "macOS" ]; then native="$GITHUB_WORKSPACE/build/bin"; fi
          dotnet test bindings/dotnet/tests/FatzAudio.Tests -c Release -p:FatzAudioNativeDir="$native"

  # NuGet "FatzAudio" with the natives the build job just tested. The version is
  # FA_VERSION_* from the header. Every run keeps the .nupkg as an artifact, as a
  # prerelease (0.2.0-ci.<run>); pushes to main publish that prerelease to GitHub
  # Packages, and a manual run on main with "release" publishes the stable 0.2.0.
  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-Windows
          path: bindings/dotnet/src/FatzAudio/runtimes/win-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-Linux
          path: bindings/dotnet/src/FatzAudio/runtimes/linux-x64/native
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pack
        shell: bash
        run: |
          suffix="ci.${{ github.run_number }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ]; then
            test "${{ github.ref }}" = "refs/heads/main"
            suffix=""
          fi
          dotnet pack bindings/dotnet/src/FatzAudio -c Release -o nupkg -p:VersionSuffix="$suffix"
      - name: Check the package carries both natives
        run: |
          unzip -l nupkg/*.nupkg | tee contents.txt
          grep -q 'runtimes/win-x64/native/fatzaudio.dll' contents.txt
          grep -q 'runtimes/linux-x64/native/libfatzaudio.so' contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: nupkg/*.nupkg
          retention-days: 14
      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release)
        # No --skip-duplicate: publishing a stable version twice fails, so bump FA_VERSION_* first.
        run: >
          dotnet nuget push nupkg/*.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}

  sanitizers:
    # 22.04 like the Linux build: on ubuntu-latest (24.04) this apt install alone
    # took 15 minutes, on 22.04 about 20 seconds.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          key: sanitizers
          max-size: 500M
      - name: Install Linux audio headers and FFmpeg (runtime codecs and the helper test)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libavformat-dev libavcodec-dev
      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir build -j "$(nproc)" --output-on-failure
      # Short fuzz pass over the small readers (ZIP, HLS, tags); the decoder readers are too slow
      # for a smoke run, rerun tests/fuzz/run.sh in full after a big decoder change.
      - name: Fuzz smoke (ZIP, HLS, tags)
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFA_FUZZ=ON -DFA_BUILD_TOOLS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake --build build-fuzz --parallel "$(nproc)" --target fuzz_tags fuzz_zip fuzz_hls
          tests/fuzz/run.sh build-fuzz fuzz-out 20000 zip hls tags
      - name: Upload fuzz crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz-out/
          if-no-files-found: ignore

  # Library only, every Android ABI: checks the .so needs nothing but libc, libm
  # and libdl and exports only fa_*.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          key: android
          max-size: 500M
      - name: Build for every Android ABI
        run: |
          for abi in arm64-v8a x86_64 armeabi-v7a x86; do
            cmake -S . -B build-android-$abi -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release \
              -DFA_BUILD_TESTS=OFF -DFA_BUILD_TOOLS=OFF
            cmake --build build-android-$abi --parallel "$(nproc)"
          done
      - name: Library size
        continue-on-error: true   # a report: never keeps the checks below from running
        run: |
          args=()
          for so in build-android-*/bin/libfatzaudio.so; do
            abi=${so#build-android-}; abi=${abi%%/*}
            args+=("Android $abi" "$so")
          done
          STRIP=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip tools/lib-size.sh "${args[@]}"
      - name: Check dependencies and exports
        run: |
          readelf=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          bad=0
          for so in build-android-*/bin/libfatzaudio.so; do
            if $readelf -d $so | grep NEEDED | grep -vE '\[lib(c|m|dl)\.so\]'; then bad=1; fi
            if $readelf --dyn-syms -W $so | awk '($5=="GLOBAL"||$5=="WEAK") && $7!="UND" {print $8}' | grep -v '^fa_'; then bad=1; fi
          done
          exit $bad

  # Every test suite inside an Android 14 user space (tools/android-test/run.sh):
  # x86_64 natively, arm64 under qemu-user.
  android-test:
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          key: android-test-${{ matrix.abi }}
          max-size: 500M
      - name: Install qemu-user
        if: matrix.abi == 'arm64-v8a'
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Build for Android ${{ matrix.abi }} with tests
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release \
            -DFA_BUILD_TOOLS=OFF
          cmake --build build-android --parallel "$(nproc)"
      - name: Test in Android 14
        run: sudo tools/android-test/run.sh build-android

  # fatzaudio.xcframework for iOS devices and the simulator.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          key: ios
          max-size: 500M
      - name: Build fatzaudio.xcframework
        run: tools/build-xcframework.sh build-ios
      - name: Library size
        continue-on-error: true
        run: tools/lib-size.sh "iOS arm64" build-ios/iphoneos/bin/fatzaudio.framework/fatzaudio
